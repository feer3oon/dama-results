name: 🏗️ Build Results

on:
  push:
    paths:
      - 'excel/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install
        run: npm ci
      
      - name: 🔍 Check for chunked upload
        id: check
        run: |
          if [ -f "excel/results.xlsx.manifest.json" ]; then
            echo "chunked=true" >> $GITHUB_OUTPUT
            echo "✅ Found chunked upload"
          else
            echo "chunked=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Single file upload"
          fi
      
      - name: 🧩 Reassemble chunks
        if: steps.check.outputs.chunked == 'true'
        run: |
          echo "📦 Reassembling chunks..."
          
          # قراءة الـ manifest
          MANIFEST=$(cat excel/results.xlsx.manifest.json)
          TOTAL_CHUNKS=$(echo $MANIFEST | jq -r '.totalChunks')
          
          echo "Total chunks: $TOTAL_CHUNKS"
          
          # دمج الأجزاء
          > excel/results.xlsx
          for i in $(seq 1 $TOTAL_CHUNKS); do
            echo "Merging chunk $i/$TOTAL_CHUNKS"
            cat "excel/results.xlsx.part$i" >> excel/results.xlsx
          done
          
          # حذف الأجزاء والـ manifest
          rm excel/results.xlsx.part* excel/results.xlsx.manifest.json
          
          # التحقق من الحجم
          SIZE=$(stat -c%s excel/results.xlsx)
          echo "✅ Reassembled file size: $((SIZE / 1024 / 1024)) MB"
      
      - name: 🔍 Find Excel
        id: find
        run: |
          EXCEL=$(find excel/ -name "*.xlsx" -o -name "*.xls" 2>/dev/null | head -1)
          if [ -z "$EXCEL" ]; then
            echo "❌ No Excel file found"
            exit 1
          fi
          echo "file=$EXCEL" >> $GITHUB_OUTPUT
          echo "✅ Found: $EXCEL"
      
      - name: 🏗️ Build
        run: node build.js "${{ steps.find.outputs.file }}" --compress
      
      - name: 🚀 Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            STUDENTS=$(node -e "console.log(require('./data/stats.json').total)")
            git commit -m "📊 تحديث النتائج - $STUDENTS طالب"
            git push
            echo "✅ Pushed"
          else
            echo "✅ No changes"
          fi
      
      - name: 📋 Summary
        if: always()
        run: |
          if [ -f "data/stats.json" ]; then
            echo "## 🎉 تم البناء بنجاح!" >> $GITHUB_STEP_SUMMARY
            node -e "const s=require('./data/stats.json');console.log('| المقياس | القيمة |\n|---|---|\n| 👥 إجمالي | '+s.total.toLocaleString('ar-EG')+' |\n| ✅ ناجح | '+s.success.toLocaleString('ar-EG')+' |\n| ❌ راسب | '+s.failed.toLocaleString('ar-EG')+' |');" >> $GITHUB_STEP_SUMMARY
          fi
